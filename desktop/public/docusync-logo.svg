<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark glowing squircle background -->
  <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#bg-grad)" stroke="url(#blue-grad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <g filter="url(#glow)">
    <!-- Left to Right Sync Arrow (Blue Glow) -->
    <path d="M76 108 H164" stroke="url(#blue-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 84 L168 108 L140 132" stroke="url(#blue-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right to Left Sync Arrow (Green Glow) -->
    <path d="M180 148 H92" stroke="url(#green-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M116 124 L88 148 L116 172" stroke="url(#green-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
